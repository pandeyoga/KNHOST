name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pindai secret pada file ter-track (GN-14)
        run: python scripts/guardrails/verify_no_secrets.py
