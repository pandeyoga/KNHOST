name: frontend-lockfile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Aktifkan Yarn sesuai packageManager (G3 V3-BUILD-01)
        run: corepack enable && yarn --version
      - name: Lockfile wajib ada & satu manager saja
        run: |
          # Platform tidak mem-push *.lock; salinan kanonis ada di deploy/frontend-yarnlock.txt (dipakai Dockerfile).
          if [ ! -f yarn.lock ]; then cp ../deploy/frontend-yarnlock.txt yarn.lock || { echo "lockfile tidak ada"; exit 1; }; fi
          cmp -s yarn.lock ../deploy/frontend-yarnlock.txt || { echo "deploy/frontend-yarnlock.txt beda dari yarn.lock"; exit 1; }
          test ! -f package-lock.json && test ! -f pnpm-lock.yaml || { echo "lockfile manager lain ditemukan"; exit 1; }
      - name: Install beku (gagal bila lock berbeda dari package.json)
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build smoke dari lock
        run: CI=false yarn build
